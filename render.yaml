services:
  - type: web
    name: ag-scorer-web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ag-scorer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_TTL_HOURS
        value: "72"
      - key: SEED_DEMO
        value: "false"

databases:
  - name: ag-scorer-db
    plan: free
    databaseName: agscorer
    user: agscorer
